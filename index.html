<style>
/* Layout: macOS-style translucent sidebar + white rounded content window on desktop; iOS large-title screens + floating glass tab bar on phones. Light, blue-grey, single theme by choice. */
:root{
  color-scheme:light;
  --bg:#EEF1F5; --side:#E3E8EF; --surface:#F5F7FA; --card:#FFFFFF; --card-2:#EEF2F6; --fill:#E6EBF1;
  --text:#1C1C1E; --muted:#6A7586; --muted-2:#97A1AF; --line:#DCE2EA; --hair:rgba(60,84,120,.13);
  --accent:#007AFF; --accent-press:#0063D1; --accent-soft:#E2EEFC; --accent-ink:#0A4FA3;
  --slate:#5D7189; --slate-soft:#E5ECF4;
  --hero:#E3EBF5; --hero-2:#D2DDEA; --ring-bg:#D0DBE8;
  --good:#1F8A3E; --good-soft:#E2F4E7; --bad:#D70015; --bad-soft:#FCE6E8; --warn:#B85000; --warn-soft:#FFEFDC;
  --c1:#007AFF; --c2:#BCD5F4; --c3:#5D7189; --c4:#0A4FA3; --c5:#E6EBF1; --grid:#E5EAF0; --heat-0:#E5EAF0;
  --h1:#CFE0F7; --h2:#89B6EE; --h3:#3A8DF5; --h4:#0A4FA3;
  --scrim:rgba(30,40,55,.32); --glass:rgba(255,255,255,.78); --focus:rgba(0,122,255,.45);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.47 var(--f);-webkit-font-smoothing:antialiased;letter-spacing:-.005em;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{height:100%;display:grid;grid-template-columns:244px minmax(0,1fr);background:var(--side)}
.side{background:var(--side);color:var(--text);display:flex;flex-direction:column;gap:18px;padding:22px 12px 16px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;font:600 15px/1.2 var(--f-d);letter-spacing:-.01em}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 15px var(--f-r)}
.logo small{display:block;font:400 12px var(--f);color:var(--muted)}
.add-big{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:600 14.5px var(--f)}
.add-big:hover{background:var(--accent-press)}
.add-big kbd{font:500 11px var(--f);background:rgba(255,255,255,.22);border-radius:5px;padding:1px 6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--text);font:500 14px var(--f);text-align:left}
.nav button .ic{color:var(--accent)}
.nav button:hover{background:rgba(60,84,120,.07)}
.nav button[aria-current="page"]{background:rgba(60,84,120,.13)}
.nav .badge{margin-left:auto;font:600 12px var(--f-r);color:var(--muted);padding:0 4px}
.nav .k{margin-left:auto;font-size:11px;color:var(--muted-2)}
.nav button .badge+.k{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.store{font-size:12px;color:var(--muted);padding:0 10px;display:flex;gap:8px;align-items:center}
.store i{width:7px;height:7px;border-radius:50%;background:var(--muted-2);flex:none}
.store.ok i{background:#34C759}
.main{margin:8px 8px 8px 0;border-radius:14px;background:var(--surface);overflow-y:auto;overflow-x:hidden;min-width:0;position:relative;box-shadow:0 0 0 .5px var(--hair),0 1px 3px rgba(40,60,90,.06)}
.page{max-width:1080px;margin:0 auto;padding:30px clamp(16px,3.2vw,40px) 56px;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--surface)}
  .side{display:none}
  .main{margin:0;border-radius:0;box-shadow:none}
  .page{padding:18px 16px 128px;gap:14px}
  .tabbar{display:flex;position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:62px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:999px;align-items:center;justify-content:space-around;padding:0 6px;z-index:30;box-shadow:0 0 0 .5px var(--hair),0 8px 28px rgba(40,60,90,.14)}
}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font:500 10.5px var(--f);padding:6px 4px;min-width:56px;border-radius:999px}
.tab[aria-current="page"]{color:var(--accent)}
.tab-plus{width:50px;height:50px;min-width:50px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;padding:0;box-shadow:0 4px 12px rgba(0,122,255,.35)}

/* type */
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:700 clamp(28px,3.6vw,34px)/1.12 var(--f-d);letter-spacing:-.022em}
.h2{font:700 21px/1.2 var(--f-d);letter-spacing:-.018em}
.h3{font:600 17px/1.3 var(--f-d);letter-spacing:-.012em}
.hl{color:var(--accent)}
.eyebrow{font:600 12px/1.2 var(--f);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.dk .eyebrow,.olive .eyebrow{color:var(--slate)}
.muted{color:var(--muted)}
.num{font:700 1em/1 var(--f-r);font-variant-numeric:tabular-nums}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}

/* surfaces */
.card{background:var(--card);border-radius:18px;padding:20px;min-width:0;box-shadow:0 0 0 .5px var(--hair)}
.dk{background:var(--card);color:var(--text);border-radius:22px;padding:24px;min-width:0;box-shadow:0 0 0 .5px var(--hair)}
.dk.hero{background:linear-gradient(160deg,#F4F8FD 0%,var(--hero) 100%)}
.olive{background:var(--slate-soft);color:var(--text);border-radius:14px;padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:11px;border:0;font:600 15px var(--f);white-space:nowrap;text-decoration:none;transition:background .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-gold{background:var(--accent);color:#fff}
.btn-gold:hover:not(:disabled){background:var(--accent-press)}
.btn-dark{background:var(--fill);color:var(--text)}
.btn-line{background:var(--accent-soft);color:var(--accent-ink)}
.btn-line:hover{background:#D3E4FA}
.btn-ghost{background:transparent;color:var(--accent);padding:0 10px}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-lg{height:50px;padding:0 28px;font-size:16.5px;border-radius:14px}
.btn-sm{height:32px;padding:0 13px;font-size:13.5px;border-radius:9px}
.ibtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.ibtn:hover{background:var(--hero-2)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:999px;border:0;background:var(--fill);color:var(--text);font:500 13.5px var(--f);display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--hero-2)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip .n{font-weight:400;opacity:.65}
.seg-ctl{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg-ctl .chip{border-radius:8px;background:transparent;height:30px}
.seg-ctl .chip[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(40,60,90,.15),0 0 0 .5px var(--hair)}
.pill{display:inline-flex;align-items:center;font:600 11.5px/1 var(--f);padding:5px 9px;border-radius:999px;white-space:nowrap}
.st-new{background:var(--fill);color:var(--muted)}
.st-learning{background:var(--accent-soft);color:var(--accent-ink)}
.st-learned{background:var(--accent);color:#fff}
.st-hard{background:var(--bad-soft);color:var(--bad)}
.tag-auto{background:var(--slate-soft);color:var(--slate);letter-spacing:.06em;font-size:10px}
.tag-need{background:var(--warn-soft);color:var(--warn)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font:500 13px var(--f);color:var(--muted)}
.inp,.sel{height:42px;border-radius:10px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);padding:0 12px;color:var(--text);width:100%;min-width:0}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inp:focus,.sel:focus,.ta:focus{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3.5px var(--focus);outline:none}
.ta{width:100%;min-height:190px;border-radius:14px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);padding:14px 16px;font:400 16px/1.55 var(--f);color:var(--text);resize:vertical}
.search{position:relative;flex:1 1 240px;min-width:0}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted-2)}
.search .inp{padding-left:38px;background:var(--fill);box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* today */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:28px}
.hero-nums{display:flex;gap:clamp(24px,5vw,52px);margin:14px 0 4px;flex-wrap:wrap}
.bignum{font:700 clamp(54px,8vw,78px)/.95 var(--f-r);color:var(--accent);font-variant-numeric:tabular-nums;display:inline-block;letter-spacing:-.02em}
#heroNew{color:var(--slate)}
.bignum-l{display:block;margin-top:8px;color:var(--muted);font-size:14px}
.hero-cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;color:var(--muted);font-size:13.5px}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta .ic{color:#FF9500}
.hero-meta b{color:var(--text);font-family:var(--f-r)}
.dots{display:inline-flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--hero-2)}
.dots i.on{background:var(--accent)}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .rv-t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv-t b{font:700 28px/1 var(--f-r);color:var(--text)}
.ring .rv-t small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.note{margin-top:16px;font-size:14px}
@media (max-width:560px){.hero{grid-template-columns:1fr;padding:22px;position:relative}.ring{width:110px;height:110px;position:absolute;right:16px;top:16px}.ring svg{width:110px;height:110px}.ring .rv-t b{font-size:21px}.ring .rv-t small{font-size:10.5px}.hero-nums{margin-top:52px}}
.bar{height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.seg{display:flex;height:7px;border-radius:999px;overflow:hidden;background:var(--fill)}
.seg i{display:block;height:100%}
.word-day{font:700 25px/1.15 var(--f-d);letter-spacing:-.02em;margin:6px 0 2px;overflow-wrap:anywhere}

/* lists (inset grouped) */
.list{display:flex;flex-direction:column;background:var(--card);border-radius:16px;box-shadow:0 0 0 .5px var(--hair);overflow:hidden}
.list>*+*{border-top:.5px solid var(--line)}
.wrow{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;background:var(--card)}
.wrow-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:12px}
.wrow-main:hover{background:var(--card-2)}
.wtxt{min-width:0;flex:1}
.wtxt b{display:block;font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.wtxt span{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.wpills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.more-list .wrow-main{padding:15px 16px;border-radius:0}
.more-list .wrow-main .ic{color:var(--accent)}
.empty{background:var(--card);border-radius:18px;padding:32px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 0 0 .5px var(--hair)}
.empty p{margin:0;max-width:44ch;color:var(--muted)}
.mode{display:flex;flex-direction:column;gap:10px;padding:22px}
.mode .mi{width:44px;height:44px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center}
.mode .mi.t2{background:#5856D6}.mode .mi.t3{background:#30B0C7}.mode .mi.t4{background:var(--slate)}.mode .mi.t5{background:#34A0DC}
.mode p{margin:0;color:var(--muted);font-size:14px;flex:1}
.mode.feat{background:linear-gradient(160deg,#F4F8FD 0%,var(--hero) 100%)}
.setc{display:flex;flex-direction:column;gap:12px}
.setc .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .v{font:700 34px/1 var(--f-r);font-variant-numeric:tabular-nums}
.dk .stat .v,.dk.stat .v{color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font:400 11px var(--f)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.scrollx{overflow-x:auto;padding-bottom:4px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.hm i{width:13px;height:13px;border-radius:3.5px;background:var(--heat-0)}
.hm i.l1{background:var(--h1)}.hm i.l2{background:var(--h2)}.hm i.l3{background:var(--h3)}.hm i.l4{background:var(--h4)}
.hm i.fut{background:transparent}
.hm-wrap{display:flex;gap:8px}
.hm-days{display:grid;grid-template-rows:repeat(7,13px);gap:3px;font-size:10px;color:var(--muted);line-height:13px}
.hard-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line)}
.hard-row:last-child{border-bottom:0}
.hard-row .rk{font:600 13px var(--f-r);color:var(--muted-2);width:22px}
.sess{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,.7fr));gap:8px;align-items:center;background:var(--card);padding:13px 18px}
.sess b{font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:560px){.sess{grid-template-columns:1fr 1fr 1fr}.sess>:first-child{grid-column:1/-1}}
details.wh{background:var(--card);padding:0 16px}
details.wh summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 0}
details.wh summary::-webkit-details-marker{display:none}
details.wh[open] summary{border-bottom:.5px solid var(--line)}
.gl-list{display:flex;flex-direction:column;gap:6px;padding:12px 0}
.gl-item{display:flex;gap:10px;align-items:center;font-size:13.5px}
.g1{background:var(--bad-soft);color:var(--bad)}.g2{background:var(--warn-soft);color:var(--warn)}.g3{background:var(--accent-soft);color:var(--accent-ink)}.g4{background:var(--good-soft);color:var(--good)}
.gdots{display:flex;gap:3px;margin-left:auto}
.gdots i{width:8px;height:8px;border-radius:50%}
.gdots i.g1{background:#FF3B30}.gdots i.g2{background:#FF9500}.gdots i.g3{background:var(--accent)}.gdots i.g4{background:#34C759}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:relative;background:var(--surface);color:var(--text);border-radius:20px;width:min(700px,100%);max-height:min(90vh,900px);overflow-y:auto;overflow-x:hidden;padding:24px;display:flex;flex-direction:column;gap:16px;animation:pop .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 24px 70px rgba(30,45,70,.28),0 0 0 .5px var(--hair)}
.sheet.wide{width:min(860px,100%)}
.sheet-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.grab{display:none}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (max-width:860px){
  .sheet-wrap{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{width:100%;border-radius:22px 22px 0 0;max-height:94%;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .34s cubic-bezier(.2,.8,.2,1)}
  .grab{display:block;width:38px;height:5px;border-radius:999px;background:var(--muted-2);opacity:.5;margin:0 auto 4px}
}
.sheet-foot{position:sticky;bottom:-24px;margin:0 -24px -24px;padding:12px 24px 20px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:.5px solid var(--line)}
@media (max-width:860px){.sheet-foot{bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:0 -16px calc(-20px - env(safe-area-inset-bottom,0px));padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:14px;color:var(--bad);font-weight:600}

/* review cards */
.rv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.rv{background:var(--card);border-radius:16px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0;box-shadow:0 0 0 .5px var(--hair),0 1px 2px rgba(40,60,90,.05)}
.rv.removed{opacity:.4}
.rv .top{display:flex;gap:6px;align-items:center}
.rv input{border:0;background:transparent;width:100%;min-width:0;padding:4px 0;border-bottom:1px solid transparent;color:var(--text)}
.rv input:focus{outline:none;border-bottom-color:var(--accent)}
.rv .en{font:600 17px/1.25 var(--f-d);letter-spacing:-.01em}
.rv .uk{font:400 15px var(--f)}
.rv .uk.need{border-bottom:1px solid var(--warn)}
.rv .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.rv .ex{font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.rv .badges{display:flex;gap:6px;flex-wrap:wrap}
.rv .x{position:absolute;right:8px;top:8px;width:28px;height:28px;color:var(--muted)}
.dup{background:var(--card-2);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:6px}

function body(k){if(k==='meta')return{v:1,created:S.created,updated:S.updated,settings:S.settings,sets:S.sets,daily:S.daily,libMigrated:!!S.libMigrated,libSeen:S.libSeen||0};if(k==='sessions')return{list:S.sessions.slice(-300)};const n=+k.slice(3);const cs=S.cards.filter(c=>c.ch===n);return cs.length?{cards:cs}:null}
async function flush(){
  if(!P.col||P.busy)return;P.busy=true;
  try{
    while(P.dirty.size&&P.col){
      const k=P.dirty.values().next().value;P.dirty.delete(k);
      const b=body(k),ref=P.col.doc(k.replace(':','_'));
      try{if(b)await ref.set(JSON.parse(JSON.stringify(b)));else await ref.delete();P.retry=0;P.err=false}
      catch(e){const c=e&&e.code;
        if(c==='unavailable'&&P.retry<2){P.retry++;P.dirty.add(k);await sleep(1000+Math.random()*1500)}
        else if(c==='quota_exceeded'){toast('Хмарне сховище заповнене. Зроби експорт і видали зайві картки.');break}
        else if(c==='resource_exhausted'){P.dirty.add(k);break}
        else{P.dirty.add(k);P.err=true;break}}
    }
  }finally{P.busy=false;if(!P.dirty.size)setDirty(0);renderStore()}
  if(P.dirty.size&&P.col){clearTimeout(P.t);P.t=setTimeout(flush,P.err?30000:4000)}
}
const SH=LS+':sheet',DF=LS+':dirty';
const shGet=()=>{try{return localStorage.getItem(SH)||''}catch(e){return''}};
const dirtyFlag=()=>{try{return localStorage.getItem(DF)==='1'}catch(e){return false}};
const setDirty=v=>{try{v?localStorage.setItem(DF,'1'):localStorage.removeItem(DF)}catch(e){}};
function shDb(url){return{
  async all(){const r=await fetch(url,{cache:'no-store'});const j=await r.json();if(!j||!j.ok)throw new Error((j&&j.error)||'bad');return j.docs||{}},
  async set(id,body){const r=await fetch(url,{method:'POST',body:JSON.stringify({id,body})});const j=await r.json();if(!j||!j.ok)throw new Error((j&&j.error)||'bad')}}}
async function initSheet(){
  const url=shGet();if(!url){P.col=null;P.mode=lsOk?'local':'memory';renderStore();return}
  P.mode='connecting';renderStore();
  const db=shDb(url);let docs;
  try{docs=await db.all()}catch(e){P.mode='offline';renderStore();setTimeout(initSheet,30000);return}
  P.col={doc:id=>({set:b=>db.set(id,b),delete:()=>db.set(id,null)})};P.mode='sheet';P.err=false;
  const meta=docs.meta;
  const localNewer=hadLocal&&!S.fresh&&((S.updated||0)>(meta&&meta.updated||0)||dirtyFlag());
  if(meta&&!localNewer){
    const cards=[];Object.keys(docs).filter(k=>k.indexOf('ch_')===0).sort((a,b)=>+a.slice(3)-+b.slice(3)).forEach(k=>{(docs[k].cards||[]).forEach(c=>cards.push(c))});
    S=normalizeState(JSON.parse(JSON.stringify({v:1,created:meta.created,updated:meta.updated,settings:meta.settings,sets:meta.sets,daily:meta.daily,sessions:(docs.sessions&&docs.sessions.list)||[],cards})));
    lsSave();setDirty(0);if(!T)render();
  }else{
    touchAll(Object.keys(docs).filter(k=>k.indexOf('ch_')===0).map(k=>+k.slice(3)));flush();
  }
  renderStore();
}

function renderStore(){const el=$('#store');if(!el)return;const m=P.mode,ok=m==='sheet'&&!P.dirty.size&&!P.err;el.className='store'+(ok?' ok':'');el.querySelector('span').textContent=m==='sheet'?(ok?'Збережено в таблиці':P.err?'Таблиця недоступна — збережу пізніше':'Синхронізую…'):m==='connecting'?'Підключаюся до таблиці…':m==='offline'?'Таблиця недоступна — дані на пристрої':lsOk?'Тільки на пристрої — підключи таблицю':'Тільки в памʼяті — зроби експорт'}

const L={db:null,user:null,me:null,owner:false,canWrite:null,sets:new Map(),cards:new Map(),setsReady:false,cardsReady:false,setsDef:false,cardsDef:false,trunc:false,q:[],qBusy:false,seenS:new Set(),seenC:new Set()};
const pend=p=>L.q.some(o=>o.path===p);
const LF=['en','uk','pos','ipa','ex','exUk'];
const libOn=()=>!!L.db&&L.setsReady;
const libWritable=()=>libOn()&&L.canWrite!==false;
const followed=id=>S.sets.find(s=>s.id===id&&s.lib);
function libBody(c,setId){const prev=c.lid&&L.cards.get(c.lid);const b={set:setId,by:(prev&&prev.by)||L.me,t:(prev&&prev.t)||Date.now(),et:Date.now()};LF.forEach(f=>b[f]=String(c[f]||''));return b}
function libPut(path,data){if(!L.db)return;L.q.push({path,data});libRun()}
function libDel(path){if(!L.db)return;L.q.push({path,del:true});libRun()}
async function libRun(){
  if(L.qBusy||!L.db)return;L.qBusy=true;
  try{while(L.q.length){const op=L.q[0];
    try{const ref=L.db.doc(op.path);if(op.del)await ref.delete();else await ref.set(op.data);L.q.shift()}
    catch(e){const c=e&&e.code;
      if(c==='unavailable'||c==='resource_exhausted'){op.tries=(op.tries||0)+1;if(op.tries>4){L.q.shift();toast('Не вдалося зберегти зміну в бібліотеці. Перевір інтернет і повтори.')}else await sleep(1200*op.tries+Math.random()*800)}
      else if(c==='invalid_argument'&&op.data&&!op.del&&L.canWrite!==true){L.q=[];L.canWrite=false;toast('Тобі не можна змінювати спільну бібліотеку. Попроси в автора доступ «Редактор».');if(!T&&!sheetOpen)render()}
      else if(c==='quota_exceeded'){L.q.shift();toast('Спільна бібліотека заповнена. Видаліть непотрібні набори.')}
      else{L.q.shift()}}}
  }finally{L.qBusy=false}
}
function libSubscribe(){
  const err=()=>{};
  L.db.collection('libsets').onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{if(d.exists){m.set(d.id,d.data());L.seenS.add(d.id)}});L.sets=m;L.setsDef=!snap.metadata.fromCache;L.setsReady=true;libSync()},err);
  L.db.collection('libcards').limit(1000).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{if(d.exists){m.set(d.id,d.data());L.seenC.add(d.id)}});L.cards=m;L.trunc=snap.size>=1000;L.cardsDef=!snap.metadata.fromCache;L.cardsReady=true;libSync()},err);
}
function fromLib(lc){const o={};LF.forEach(f=>o[f]=String(lc[f]||''));o.set=lc.set;return o}
function libSync(){
  if(!L.setsReady||!L.cardsReady)return;
  renderStore();
  let changed=false;const chs=new Set(),added={},orphan=[];
  if(L.setsDef){S.sets.forEach(s=>{if(s.lib&&!L.sets.has(s.id)&&L.seenS.has(s.id)&&!pend('libsets/'+s.id)){s.lib=false;S.cards.forEach(c=>{if(c.set===s.id&&c.lid){delete c.lid;chs.add(c.ch)}});orphan.push(s.name);changed=true}})}
  S.sets.forEach(s=>{if(s.lib){const ls=L.sets.get(s.id);if(ls&&ls.name&&ls.name!==s.name){s.name=ls.name;changed=true}}});
  const byLid=new Map();S.cards.forEach(c=>{if(c.lid)byLid.set(c.lid,c)});
  const fresh=[];const now=Date.now();
  L.cards.forEach((lc,lid)=>{const pc=byLid.get(lid);
    if(pc){let d=false;LF.forEach(f=>{const v=String(lc[f]||'');if(pc[f]!==v){pc[f]=v;d=true}});if(lc.set!==pc.set&&followed(lc.set)){pc.set=lc.set;d=true}if(d){chs.add(pc.ch);changed=true}}
    else{const s=followed(lc.set);if(s&&!(s.skip||[]).includes(lid)&&lc.en&&lc.uk){const c=makeCard(fromLib(lc),now+fresh.length);c.lid=lid;fresh.push(c);added[s.name]=(added[s.name]||0)+1}}
  });
  if(fresh.length){assignChunks(fresh,S.cards);S.cards.push(...fresh);fresh.forEach(c=>chs.add(c.ch));changed=true}
  if(L.cardsDef&&L.setsDef&&!L.trunc){const before=S.cards.length;S.cards=S.cards.filter(c=>{if(c.lid&&!L.cards.has(c.lid)&&L.seenC.has(c.lid)&&!pend('libcards/'+c.lid)&&L.sets.has(c.set)){chs.add(c.ch);return false}return true});if(S.cards.length!==before)changed=true}
  if(L.owner&&!S.libMigrated&&L.setsDef&&L.cardsDef&&libWritable()){S.libMigrated=true;S.sets.filter(s=>!s.lib&&S.cards.some(c=>c.set===s.id)).map(s=>s.id).forEach(id=>shareSet(id,true));changed=true}
  if(changed){chs.forEach(n=>P.dirty.add('ch:'+n));touch('meta')}
  orphan.forEach(n=>toast('Набір «'+n+'» видалили з бібліотеки. Твої картки з нього лишились у тебе.'));
  Object.keys(added).forEach(n=>toast('Нові слова в наборі «'+n+'»: +'+added[n]));
  if(T)return;
  if(!sheetOpen)render();else{renderNav();if(sheetKind==='lib'&&LV.id)renderLibSheet()}
}
function shareSet(id,quiet){
  const s=S.sets.find(x=>x.id===id);if(!s||s.lib||!libWritable())return;
  const nid='L'+uid();libPut('libsets/'+nid,{name:s.name,by:L.me,t:Date.now()});
  const chs=new Set();S.cards.filter(c=>c.set===id).forEach(c=>{c.lid=c.lid||('c'+uid());c.set=nid;libPut('libcards/'+c.lid,libBody(c,nid));chs.add(c.ch)});
  s.id=nid;s.lib=true;s.skip=[];chs.forEach(n=>P.dirty.add('ch:'+n));touch('meta');
  if(!quiet){render();toast('Набір «'+s.name+'» тепер у спільній бібліотеці')}
}
function followSet(id){
  const ls=L.sets.get(id);if(!ls||S.sets.some(s=>s.id===id))return;
  S.sets.push({id,name:ls.name,lib:true,skip:[]});const now=Date.now(),fresh=[];
  L.cards.forEach((lc,lid)=>{if(lc.set===id&&lc.en&&lc.uk){const c=makeCard(fromLib(lc),now+fresh.length);c.lid=lid;fresh.push(c)}});
  assignChunks(fresh,S.cards);S.cards.push(...fresh);fresh.forEach(c=>P.dirty.add('ch:'+c.ch));touch('meta');
  if(sheetOpen)closeSheet();render();toast('Додано «'+ls.name+'»: '+fresh.length+' '+plural(fresh.length,'картка','картки','карток')+' в навчання');
}
function unfollowSet(id,confirmed){
  const s=S.sets.find(x=>x.id===id);if(!s)return;const n=S.cards.filter(c=>c.set===id).length;
  if(!confirmed){openSheet(sheetHead('Прибрати «'+esc(s.name)+'» з моїх?')+'<p style="margin:0">'+n+' '+plural(n,'картка','картки','карток')+' і твій прогрес по них зникнуть у тебе. У спільній бібліотеці набір лишиться — його можна додати знову.</p><div class="sheet-foot"><button class="btn btn-line" data-act="closeSheet">Скасувати</button><button class="btn btn-danger" data-act="unfollowYes" data-id="'+id+'">Прибрати</button></div>','confirm');return}

function removeSetLocal(id){S.sets=S.sets.filter(x=>x.id!==id);const chs=new Set();S.cards=S.cards.filter(c=>{if(c.set===id){chs.add(c.ch);return false}return true});chs.forEach(n=>P.dirty.add('ch:'+n));touch('meta')}
function libDeleteSet(id,confirmed){
  const ls=L.sets.get(id);const nm=ls?ls.name:(S.sets.find(x=>x.id===id)||{}).name||'';
  const n=[...L.cards.values()].filter(c=>c.set===id).length;

}
function newLibCount(){if(!libOn())return 0;let n=0;L.sets.forEach((s,id)=>{if(!followed(id)&&s.by!==L.me&&(s.t||0)>(S.libSeen||0))n++});return n}

/* ---------- SRS (SM-2 with learning steps) ---------- */
const LSTEPS=[1,10];
function schedule(c,g,now){
  const tk=dayKey(now);const r={st:c.st,ef:c.ef,ivl:c.ivl,step:c.step,due:c.due,lapses:c.lapses,reps:c.reps+1};
  const toDay=n=>{r.ivl=Math.min(3650,Math.max(1,Math.round(n)));r.due=dayStart(tk,r.ivl);r.st='review';r.step=0};
  if(c.st==='new'||c.st==='learn'){
    r.st='learn';
    if(g===1){r.step=0;r.due=now+LSTEPS[0]*MIN}
    else if(g===2){r.due=now+(c.step===0?6:LSTEPS[Math.min(c.step,LSTEPS.length-1)])*MIN}
    else if(g===3){if(c.st==='learn'&&c.step+1<LSTEPS.length){r.step=c.step+1;r.due=now+LSTEPS[r.step]*MIN}else if(c.st==='new'){r.step=1;r.due=now+LSTEPS[1]*MIN}else toDay(1)}
    else toDay(4);
  }else if(c.st==='review'){
    if(g===1){r.lapses++;r.ef=Math.max(1.3,c.ef-0.2);r.st='relearn';r.step=0;r.ivl=Math.max(1,Math.round(c.ivl*0.5));r.due=now+10*MIN}
    else if(g===2){r.ef=Math.max(1.3,c.ef-0.15);toDay(Math.max(c.ivl+1,c.ivl*1.2))}
    else if(g===3){toDay(Math.max(c.ivl+1,c.ivl*c.ef))}
    else{r.ef=c.ef+0.15;toDay(Math.max(c.ivl+2,c.ivl*c.ef*1.3))}
  }else{ /* relearn */
    if(g<=2){r.due=now+10*MIN}
    else if(g===3)toDay(c.ivl||1);
    else toDay((c.ivl||1)+1);
  }
  return r;
}
function ivlLabel(c,g,now){const r=schedule(c,g,now);if(r.st==='review'){const d=r.ivl;if(d<30)return d+' д';if(d<365)return String(Math.round(d/3)/10).replace('.',',')+' міс';return String(Math.round(d/36.5)/10).replace('.',',')+' р'}const m=Math.max(1,Math.round((r.due-now)/MIN));return m<60?m+' хв':Math.round(m/60)+' год'}
function status(c){if(c.st==='new')return'new';if(c.hard)return'hard';if(c.st==='review'&&c.ivl>=21)return'learned';return'learning'}
const STL={new:'Нове',learning:'Вчу',learned:'Вивчено',hard:'Важке'};
function isSched(c,now){if(c.st==='new')return (dd().new||0)<S.settings.newPerDay;if(c.st==='review')return c.due<nextDay();return c.due<=now+20*MIN}
function countLearned(){return S.cards.filter(c=>status(c)==='learned').length}
function todayQueue(){
  const now=Date.now(),nd=nextDay(),d=S.daily[today()]||{};const learn=[],rev=[],nw=[];
  for(const c of S.cards){if(c.st==='new')nw.push(c);else if(c.st==='review'){if(c.due<nd)rev.push(c)}else if(c.due<=now+20*MIN)learn.push(c)}
  learn.sort((a,b)=>a.due-b.due);rev.sort((a,b)=>((b.hard?1:0)-(a.hard?1:0))||(a.due-b.due));nw.sort((a,b)=>a.created-b.created);
  const paused=rev.length>40;const newLeft=paused?0:Math.max(0,S.settings.newPerDay-(d.new||0));
  const revAvail=Math.min(rev.length,Math.max(0,S.settings.reviewCap-(d.rev||0)));
  return{learn,rev,revAvail,newCards:nw.slice(0,newLeft),newLeft,paused,totalNew:nw.length,backlog:rev.length};
}
function srsOrder(q){const out=q.learn.slice();const rv=q.rev.slice(0,q.revAvail),nw=q.newCards.slice();let i=0;while(rv.length||nw.length){if(rv.length&&(i%4!==3||!nw.length))out.push(rv.shift());else out.push(nw.shift());i++}return out}
function streak(){let k=today();if(!(S.daily[k]&&S.daily[k].tot))k=addDays(k,-1);let n=0;while(S.daily[k]&&S.daily[k].tot){n++;k=addDays(k,-1)}return n}

if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function pickVoice(){if(!voices.length)loadVoices();return voices.find(v=>v.voiceURI===S.settings.voice)||voices.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|google|aria|jenny|natural/i.test(v.name))||voices.find(v=>/en[-_]US/i.test(v.lang))||voices[0]}
function speak(t){if(!t)return;if(!('speechSynthesis' in window)){toast('Озвучка недоступна в цьому браузері.');return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/…/g,''));u.lang='en-US';const v=pickVoice();if(v)u.voice=v;u.rate=S.settings.rate||0.95;speechSynthesis.speak(u)}catch(e){}}

function ring(p){const r=58,C=2*Math.PI*r;return '<svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="var(--ring-bg)" stroke-width="13"/><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-Math.min(1,p))).toFixed(1)+'"/></svg>'}

VIEWS.today=function(){
  const now=new Date(),q=todayQueue(),d=S.daily[today()]||{};
  const rev=q.learn.length+q.revAvail,nw=q.newCards.length,left=rev+nw,done=d.tot||0;
  const p=done+left?done/(done+left):0;const stk=streak(),sess=d.sess||0;
  const size=Math.min(S.settings.sessionSize,left),mins=Math.max(1,Math.round(size*20/60));
  const learned=countLearned(),inStudy=S.cards.filter(c=>c.st!=='new').length;
  let main;
  if(!S.cards.length){
    main='<div class="dk"><div class="eyebrow">Сьогодні</div><h2 class="h2" style="margin-top:10px">Колода порожня</h2><p class="muted">Встав перші слова — по одному або парою «word — переклад» на рядок. Або візьми готовий набір зі спільної бібліотеки.</p><div class="row"><button class="btn btn-gold btn-lg" data-act="add">'+ic('plus',20,2.4)+'Додати слова</button>'+(L.db?'<button class="btn btn-line btn-lg" data-act="go" data-v="sets">Бібліотека</button>':'')+'</div></div>';
  }else{
    const tomorrow=S.cards.filter(c=>c.st!=='new'&&c.due>=nextDay()&&c.due<dayStart(today(),2)).length;
    main='<section class="dk hero" id="hero" aria-label="Сьогодні">'+
      '<div><div class="eyebrow">Сьогодні · '+WD[now.getDay()]+', '+now.getDate()+' '+MON[now.getMonth()]+'</div>'+
      (left?'<div class="hero-nums"><div><span class="bignum" id="heroRev">'+rev+'</span><span class="bignum-l">на повторення</span></div><div><span class="bignum" id="heroNew">'+nw+'</span><span class="bignum-l">'+plural(nw,'нова','нові','нових')+'</span></div></div>'+
        '<div class="hero-cta"><button class="btn btn-gold btn-lg" data-act="start" data-mode="mixed" data-scope="today">'+ic('play',18,2.2)+'Почати</button><span class="muted">'+size+' '+plural(size,'картка','картки','карток')+' · ~'+mins+' хв</span></div>'
       :'<h2 class="h2" style="margin-top:14px">На сьогодні все</h2><p class="muted" style="margin:6px 0 0">Завтра чекає '+tomorrow+' '+plural(tomorrow,'повторення','повторення','повторень')+'. <span id="heroNew" hidden>0</span></p><div class="hero-cta"><button class="btn btn-gold" data-act="start" data-mode="flip" data-scope="all">Вільна практика</button></div>')+
      (q.paused?'<p class="note olive">Накопичилось '+q.backlog+' повторень. Нові слова на паузі, поки їх не стане менше 40. Роби частинами по '+S.settings.sessionSize+' — сьогодні максимум '+S.settings.reviewCap+'.</p>':'')+
      '<div class="hero-meta"><span>'+ic('flame',16)+'<b>'+stk+'</b> '+plural(stk,'день','дні','днів')+' поспіль</span><span>Сесії сьогодні <span class="dots" aria-label="'+sess+' з 3">'+[0,1,2].map(i=>'<i class="'+(i<sess?'on':'')+'"></i>').join('')+'</span></span><span>У колоді <b id="deckN">'+S.cards.length+'</b></span></div></div>'+
      '<div class="ring" aria-label="Денна норма: '+Math.round(p*100)+'%">'+ring(p)+'<div class="rv-t"><div><b>'+Math.round(p*100)+'%</b><small>денна норма</small></div></div></div>'+
    '</section>';
  }
  const g=S.settings.goal,gp=Math.min(1,inStudy/g);
  const pool=S.cards.filter(c=>c.st!=='new'&&c.pos!=='речення');const pool2=pool.length?pool:S.cards.filter(c=>c.pos!=='речення');
  let wod='';if(pool2.length){const seed=[...today()].reduce((a,ch)=>a+ch.charCodeAt(0),0);const c=pool2[seed%pool2.length];
    wod='<div class="card"><div class="eyebrow">Речення дня</div><div class="row" style="margin-top:6px"><div class="word-day">'+esc(c.en)+'</div><button class="ibtn" data-act="say" data-t="'+esc(c.en)+'" aria-label="Озвучити">'+ic('speaker',18)+'</button></div><p class="muted" style="margin:4px 0 0">Склади вголос одне речення про свій день з цим словом. Можеш написати його мені в чат — поправлю.</p></div>'}
  const nl=newLibCount();
  return hdr('Слово за словом','Привіт, <span class="hl">'+esc(S.settings.name)+'</span>')+main+
    (nl?'<div class="card row" style="justify-content:space-between"><span><b>'+nl+' '+plural(nl,'новий набір','нові набори','нових наборів')+'</b> <span class="muted">у спільній бібліотеці</span></span><button class="btn btn-line btn-sm" data-act="go" data-v="sets">Переглянути</button></div>':'')+
    '<div class="grid3">'+
      '<div class="card"><div class="eyebrow">Ціль</div><div class="row" style="margin:8px 0 10px;justify-content:space-between"><span><b class="num" style="font-size:28px">'+inStudy+'</b> <span class="muted">/ '+g+' слів</span></span><span class="muted">до '+fmtD(S.settings.goalDate)+'</span></div><div class="bar"><i style="width:'+(gp*100).toFixed(1)+'%"></i></div><p class="muted" style="margin:10px 0 0;font-size:13.5px">Вивчено (інтервал 21+ д): '+learned+'</p></div>'+
      wod+
      '<div class="card"><div class="eyebrow">Швидке тренування</div><div class="chips" style="margin-top:10px">'+
        [['lesson','Урок'],['mixed','Картки + вибір'],['flip','Картки'],['choice','4 варіанти'],['type','Напиши'],['listen','Слухай']].map(m=>'<button class="chip" data-act="start" data-mode="'+m[0]+'" data-scope="today">'+m[1]+'</button>').join('')+
      '</div><p class="muted" style="margin:10px 0 0;font-size:13.5px">План: 3 сесії по ~5 хв — ранок нові, день і вечір повторення.</p></div>'+
    '</div>';
};

VIEWS.train=function(){
  const dir=S.settings.dir,q=todayQueue(),n=q.learn.length+q.revAvail+q.newCards.length;
  const opts='<option value="today">Сьогоднішня черга ('+n+')</option><option value="all">Усі слова (вільна практика)</option><option value="hard">Важкі слова ('+S.cards.filter(c=>c.hard).length+')</option>'+S.sets.map(s=>'<option value="'+s.id+'">Набір: '+esc(s.name)+'</option>').join('');
  const modes=[['lesson','book','Урок','Шість вправ на одних словах: Learn, Match, Fill in, Choose, Speak, Write. Обери набір у полі «Що тренуємо».','feat','t1'],['mixed','mix','Картки + вибір','Чергує картки з перевертанням і вибір з 4 варіантів в одній вправі. Нові слова спершу показую карткою.','','t1'],['flip','flip','Картки','Перевертай і оцінюй, наскільки легко згадав.','','t4'],['choice','grid','Обери з 4 варіантів','Слово англійською чи українською — обираєш правильний переклад.','','t2'],['type','type','Напиши переклад','Вводиш відповідь сам — найкраще для памʼяті.','','t5'],['listen','ear','Слухай і впізнавай','Чуєш слово — обираєш переклад. Тренує слух.','','t3']];
  return hdr('Тренування','Обери <span class="hl">режим</span>')+
    '<div class="card"><div class="row" style="gap:16px;align-items:flex-end">'+
      '<div class="field" style="flex:1 1 240px"><span>Що тренуємо</span><select class="sel" id="scope">'+opts+'</select></div>'+
      '<div class="field"><span>Напрямок</span><div class="chips seg-ctl" role="group" aria-label="Напрямок">'+[['en','EN → UA'],['uk','UA → EN'],['mix','Змішано']].map(x=>'<button class="chip" data-act="dir" data-v="'+x[0]+'" aria-pressed="'+(dir===x[0])+'">'+x[1]+'</button>').join('')+'</div></div>'+
    '</div></div>'+
    '<div class="grid2">'+modes.map(m=>'<div class="dk mode '+m[4]+'"><div class="mi '+m[5]+'">'+ic(m[1],24)+'</div><h2 class="h2">'+m[2]+'</h2><p>'+m[3]+'</p><div><button class="btn btn-gold" data-act="start" data-mode="'+m[0]+'">Почати</button></div></div>').join('')+'</div>'+
    '<p class="hint">Клавіші: пробіл — перевернути, 1–4 — варіант або оцінка, Enter — перевірити / далі, P — озвучити, Esc — вийти.</p>';
};

const W={q:'',set:'all',st:'all'};
function wordRows(){
  const q=W.q.trim().toLowerCase();
  const list=S.cards.filter(c=>(W.set==='all'||(c.set||'')===W.set)&&(W.st==='all'||status(c)===W.st)&&(!q||c.en.toLowerCase().includes(q)||c.uk.toLowerCase().includes(q)||(c.tags||[]).join(' ').toLowerCase().includes(q))).sort((a,b)=>b.created-a.created);
  if(!S.cards.length)return '<div class="empty"><h2 class="h2">Тут поки порожньо</h2><p>Натисни «Додати слова» і встав список — переклад, приклад і транскрипцію я додам сам.</p><button class="btn btn-gold" data-act="add">Додати слова</button></div>';
  if(!list.length)return '<div class="empty"><p>Нічого не знайшлося. Зміни пошук або фільтр.</p></div>';
  return '<div class="list">'+list.map(c=>{const s=status(c);return '<div class="wrow"><button class="wrow-main" data-act="edit" data-id="'+c.id+'" aria-label="Редагувати '+esc(c.en)+'"><div class="wtxt"><b>'+esc(c.en)+'</b><span>'+esc(c.uk||'— без перекладу')+'</span></div><div class="wpills">'+(c.auto?'<span class="pill tag-auto">АВТО</span>':'')+(!c.uk?'<span class="pill tag-need">Додай переклад</span>':'')+'<span class="pill st-'+s+'">'+STL[s]+'</span></div></button><button class="ibtn" data-act="say" data-t="'+esc(c.en)+'" aria-label="Озвучити '+esc(c.en)+'">'+ic('speaker',18)+'</button></div>'}).join('')+'</div>';
}
VIEWS.words=function(){
  const cnt={all:S.cards.length,new:0,learning:0,learned:0,hard:0};S.cards.forEach(c=>cnt[status(c)]++);
  return hdr('Слова','Твої <span class="hl">слова</span>','<button class="btn btn-gold" data-act="add">'+ic('plus',18,2.4)+'Додати</button>')+
    '<div class="row"><label class="search"><span class="sr">Пошук</span>'+ic('search',18)+'<input class="inp" id="wq" type="search" placeholder="Пошук англійською чи українською" value="'+esc(W.q)+'" autocomplete="off"></label>'+
    '<select class="sel" id="wset" style="flex:0 1 220px" aria-label="Набір"><option value="all">Усі набори</option>'+S.sets.map(s=>'<option value="'+s.id+'"'+(W.set===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'<option value=""'+(W.set===''?' selected':'')+'>Без набору</option></select></div>'+
    '<div class="chips" role="group" aria-label="Статус">'+[['all','Усі'],['new','Нове'],['learning','Вчу'],['learned','Вивчено'],['hard','Важке']].map(x=>'<button class="chip" data-act="wst" data-v="'+x[0]+'" aria-pressed="'+(W.st===x[0])+'">'+x[1]+' <span class="n">'+cnt[x[0]]+'</span></button>').join('')+'</div>'+
    '<div id="wlist">'+wordRows()+'</div>';
};

VIEWS.sets=function(){
  const groups=S.sets.map(s=>({id:s.id,name:s.name,lib:!!s.lib,cards:S.cards.filter(c=>c.set===s.id)}));
  const none=S.cards.filter(c=>!c.set||!S.sets.some(s=>s.id===c.set));if(none.length)groups.push({id:'',name:'Без набору',cards:none,virtual:true});
  const mine=groups.length?'<div class="grid3">'+groups.map(g=>{const n=g.cards.length,cn={new:0,learning:0,learned:0,hard:0};g.cards.forEach(c=>cn[status(c)]++);const pc=n?Math.round(cn.learned/n*100):0;const ls=g.lib?L.sets.get(g.id):null;
      return '<div class="card setc"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2 class="h3" style="overflow-wrap:anywhere">'+esc(g.name)+'</h2><span class="num" style="font-size:22px">'+pc+'%</span></div>'+
      '<div class="row" style="gap:6px">'+(g.lib?'<span class="pill share">Спільний</span>'+(ls?'<span class="lib-who">автор: '+author(ls.by)+'</span>':''):g.virtual?'':'<span class="pill own">Лише в тебе</span>')+'</div>'+
      '<div class="seg" aria-label="Прогрес набору">'+(n?['learned','learning','hard','new'].map(k=>'<i style="width:'+(cn[k]/n*100)+'%;background:'+({learned:'var(--c1)',learning:'var(--c2)',hard:'var(--bad)',new:'transparent'})[k]+'"></i>').join(''):'')+'</div>'+
      '<div class="meta"><span>'+n+' '+plural(n,'картка','картки','карток')+'</span><span>вивчено '+cn.learned+' · вчу '+(cn.learning+cn.hard)+' · нових '+cn.new+'</span></div>'+
      '<div class="row"><button class="btn btn-gold btn-sm" data-act="start" data-mode="mixed" data-scope="'+g.id+'"'+(n?'':' disabled')+'>Тренувати</button>'+(g.virtual?'':'<button class="btn btn-line btn-sm" data-act="start" data-mode="lesson" data-scope="'+g.id+'"'+(n>=4?'':' disabled')+'>Урок</button>')+'<button class="btn btn-line btn-sm" data-act="setView" data-id="'+g.id+'">Слова</button>'+
      (!g.lib&&!g.virtual&&libWritable()&&n?'<button class="btn btn-line btn-sm" data-act="share" data-id="'+g.id+'">Поділитися</button>':'')+
      (g.virtual?'':'<span class="spacer"></span><button class="ibtn" data-act="setEdit" data-id="'+g.id+'" aria-label="Змінити набір">'+ic('pen',16)+'</button>')+'</div></div>'}).join('')+'</div>'
    :'<div class="empty"><p>У тебе ще немає наборів. Створи свій.</p></div>';
  let lib;
  if(!L.db)lib='<div class="note-box">Усі набори зберігаються на цьому пристрої, а якщо підключено Google-таблицю — і в ній.</div>';
  else if(!L.setsReady)lib='<div class="card"><span class="sk"></span></div>';
  else{
    const others=[...L.sets.entries()].filter(([id])=>!followed(id)).sort((a,b)=>(b[1].t||0)-(a[1].t||0));
    lib=others.length?'<div class="grid3">'+others.map(([id,s])=>{const cs=[...L.cards.values()].filter(c=>c.set===id);const fresh=s.by!==L.me&&(s.t||0)>(S.libSeen||0);
      return '<div class="card setc"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2 class="h3" style="overflow-wrap:anywhere">'+esc(s.name)+'</h2>'+(fresh?'<span class="pill fresh">Новий</span>':'')+'</div>'+
      '<span class="lib-who">'+cs.length+' '+plural(cs.length,'слово','слова','слів')+' · автор: '+author(s.by)+'</span>'+
      '<p class="lib-sample">'+(cs.length?esc(cs.slice(0,4).map(c=>c.en).join(', '))+(cs.length>4?'…':''):'Поки порожній')+'</p>'+
      '<div class="row"><button class="btn btn-gold btn-sm" data-act="follow" data-id="'+id+'">Додати собі</button><button class="btn btn-line btn-sm" data-act="libOpen" data-id="'+id+'">Переглянути</button></div></div>'}).join('')+'</div>'
      :'<div class="empty"><p>Тут зʼявляться набори, якими поділяться інші. Усі спільні набори, які є зараз, уже в тебе.</p></div>';
    if(L.canWrite===false)lib='<div class="note-box">Ти можеш переглядати бібліотеку й додавати набори собі. Щоб додавати й змінювати слова для всіх, потрібен доступ «Редактор».</div>'+lib;
  }
  return hdr('Набори','Групи <span class="hl">слів</span>','<button class="btn btn-gold" data-act="setNew">'+ic('plus',18,2.4)+'Новий набір</button>')+
    '<div class="sec-h"><h2 class="h2">Мої набори</h2><span class="hint">Те, що ти вчиш</span></div>'+mine+
    '';
};

/* library set sheet */
const LV={id:null};
function openLibSet(id){LV.id=id;openSheet('','lib',true);renderLibSheet()}
function renderLibSheet(){
  const id=LV.id,s=L.sets.get(id);if(!s){closeSheet();return}
  const cs=[...L.cards.entries()].filter(([,c])=>c.set===id).sort((a,b)=>(a[1].t||0)-(b[1].t||0));const fol=!!followed(id),w=libWritable();
  setSheet(sheetHead(esc(s.name),cs.length+' '+plural(cs.length,'слово','слова','слів')+' · автор: '+author(s.by)+(fol?' · уже в тебе':''))+
    (cs.length?'<div class="list">'+cs.map(([lid,c])=>'<div class="wrow"><button class="wrow-main" data-act="libCard" data-id="'+lid+'"'+(w?'':' disabled')+'><div class="wtxt"><b>'+esc(c.en)+'</b><span>'+esc(c.uk)+'</span></div>'+(c.by&&c.by!==s.by?'<span class="lib-who">'+author(c.by)+'</span>':'')+'</button><button class="ibtn" data-act="say" data-t="'+esc(c.en)+'" aria-label="Озвучити">'+ic('speaker',18)+'</button></div>').join('')+'</div>':'<div class="empty"><p>У наборі ще немає слів.</p></div>')+
    '<div class="sheet-foot">'+(w?'<button class="btn btn-danger" data-act="libDelSet" data-id="'+id+'" style="margin-right:auto">Видалити для всіх</button>':'')+(fol?'<button class="btn btn-line" data-act="closeSheet">Закрити</button>':'<button class="btn btn-line" data-act="closeSheet">Закрити</button><button class="btn btn-gold" data-act="follow" data-id="'+id+'">Додати собі</button>')+'</div>');
  fillNames($('#sheet'));
}
function openLibCard(lid){const c=L.cards.get(lid);if(!c)return;const back=LV.id;
  setSheet(sheetHead('Спільне слово','Зміни побачать усі учасники')+'<div class="grid2" style="gap:12px">'+
    '<label class="field"><span>Англійською</span><input class="inp" id="l_en" value="'+esc(c.en)+'"></label><label class="field"><span>Українською</span><input class="inp" id="l_uk" value="'+esc(c.uk)+'"></label>'+
    '<label class="field" style="grid-column:1/-1"><span>Приклад англійською</span><input class="inp" id="l_ex" value="'+esc(c.ex)+'"></label><label class="field" style="grid-column:1/-1"><span>Переклад прикладу</span><input class="inp" id="l_exUk" value="'+esc(c.exUk)+'"></label></div>'+
    '<div class="sheet-foot"><button class="btn btn-danger" data-act="libCardDel" data-id="'+lid+'" style="margin-right:auto">Видалити для всіх</button><button class="btn btn-line" data-act="libBack">Назад</button><button class="btn btn-gold" data-act="libCardSave" data-id="'+lid+'">Зберегти</button></div>');
  LV.id=back;sheetKind='libcard';
}
function libCardSave(lid){const c=L.cards.get(lid);if(!c)return;const v=k=>(($('#l_'+k)||{}).value||'').trim();if(!v('en')||!v('uk')){toast('Заповни слово і переклад.');return}
  const b=Object.assign({},c,{en:v('en'),uk:v('uk'),ex:v('ex'),exUk:v('exUk'),et:Date.now()});libPut('libcards/'+lid,b);L.cards.set(lid,b);sheetKind='lib';renderLibSheet();toast('Збережено для всіх')}
function libCardDel(lid){const c=L.cards.get(lid);if(!c)return;libDel('libcards/'+lid);L.cards.delete(lid);sheetKind='lib';renderLibSheet();
  toast('«'+c.en+'» видалено для всіх',{action:'Скасувати',onAction:()=>{libPut('libcards/'+lid,c);L.cards.set(lid,c);if(sheetKind==='lib')renderLibSheet()}})}

function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
VIEWS.progress=function(){
  const tk=today(),cnt={new:0,learning:0,learned:0,hard:0};S.cards.forEach(c=>cnt[status(c)]++);
  let tot30=0,ok30=0;for(let i=0;i<30;i++){const d=S.daily[addDays(tk,-i)];if(d){tot30+=d.tot||0;ok30+=d.ok||0}}
  const acc=tot30?Math.round(ok30/tot30*100):null;
  /* growth */
  let start=tk;S.cards.forEach(c=>{const k=dayKey(c.created);if(k<start)start=k});Object.keys(S.daily).forEach(k=>{if(k<start)start=k});
  if(start>addDays(tk,-13))start=addDays(tk,-13);
  const days=[];for(let k=start;k<=tk;k=addDays(k,1)){days.push(k);if(days.length>400)break}
  const created=S.cards.map(c=>dayKey(c.created)).sort();let ci=0,lv=0;const tot=[],lrn=[];

function lang(s){const c=(String(s).match(/[Ѐ-ӿ]/g)||[]).length,l=(String(s).match(/[A-Za-z]/g)||[]).length;return c>l?'uk':(l?'en':'?')}
const HEAD=/^(english|англійськ\S*|англ\.?|eng|en|ukrainian|українськ\S*|укр\.?|ua|uk|translation|переклад|word|слово|term|термін|фраза|phrase)$/i;
function csvLine(s){const out=[];let cur='',q=false;for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch==='"'){if(s[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===','){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())}
function tidy(s,lg){s=String(s||'').trim().replace(/^["']|["']$/g,'').trim();if(lg==='en'&&/^[A-Z][a-z'’-]+$/.test(s)&&s!=='I')s=s.toLowerCase();if(lg==='uk'&&/^[А-ЯІЇЄҐ][а-яіїєґʼ'’-]+$/.test(s))s=s.toLowerCase();return s}
function splitLine(raw){
  let s=String(raw).replace(/^﻿/,'').trim();if(!s)return null;
  s=s.replace(/^(\d+[.)]|[•*·▪◦])\s+/,'').replace(/^-\s+/,'');
  let parts=null;
  if(s.indexOf('\t')>=0)parts=s.split('\t').map(x=>x.trim()).filter(Boolean);
  else{const m=s.match(/\s+[-–—=]\s+|\s*[—–]\s*|\s*[;=|]\s*|:\s+/);
    if(m&&m.index>0)parts=[s.slice(0,m.index),s.slice(m.index+m[0].length)];
    else if(s.indexOf(',')>=0){const f=csvLine(s).filter(Boolean);if(f.length>=2&&lang(f[0])!==lang(f[1])&&lang(f[0])!=='?'&&lang(f[1])!=='?')parts=f}}
  if(parts&&parts.length>=2){
    let a=parts[0],b=parts[1];if(HEAD.test(a.trim())&&HEAD.test(b.trim()))return null;
    let en=a,uk=b;if(lang(a)==='uk'&&lang(b)!=='uk'){en=b;uk=a}

  }

function parseInput(text){

  const single=items.filter(i=>!i.en!==!i.uk).length;let pairs=0;
  for(let i=0;i<items.length-1;i++)if(items[i].en&&!items[i].uk&&items[i+1].uk&&!items[i+1].en){pairs++;i++}
  if(pairs>=2&&pairs*2>=single*0.6){const out=[];for(let i=0;i<items.length;i++){const a=items[i],b=items[i+1];if(a.en&&!a.uk&&b&&b.uk&&!b.en){out.push({en:a.en,uk:b.uk,ex:''});i++}else out.push(a)}return out}
  return items;
}
const normEn=s=>String(s||'').toLowerCase().replace(/[’ʼ`]/g,"'").replace(/[….,!?;:"«»()]/g,' ').replace(/\s+/g,' ').trim();
function dictFill(it){

  else if(it.en&&!it.pos){const d=DICT[normEn(it.en)];if(d)it.pos=d.pos}
}

    if(e.key==='Escape'){e.preventDefault();closeSheet();return}
    if(tg.id==='addTa'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();doParse();return}
    if(A&&A.step==='review'&&tg.dataset&&tg.dataset.f&&e.key==='Enter'){e.preventDefault();const ins=$$('.rv input');const k=ins.indexOf(tg);if(k>=0&&ins[k+1])ins[k+1].focus();else doSave();return}
    if(tg.id==='setName'&&e.key==='Enter'){e.preventDefault();const b=$('[data-act="setSave"]');if(b)setSave(b.dataset.id);return}
    return;
  }
  if(inField)return;
  if(e.code==='KeyN'){e.preventDefault();openAdd();return}
  if(/^[1-6]$/.test(e.key)){e.preventDefault();go(NAV[+e.key-1][0])}
});
/* lesson drag & drop */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-lchip]');if(c&&LN){e.dataTransfer.setData('text/plain',c.dataset.lchip);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const b=LN&&e.target.closest&&e.target.closest('[data-lbox]');if(b){e.preventDefault();e.dataTransfer.dropEffect='move';b.classList.add('over')}});
document.addEventListener('dragleave',e=>{const b=e.target.closest&&e.target.closest('[data-lbox]');if(b&&!b.contains(e.relatedTarget))b.classList.remove('over')});
document.addEventListener('drop',e=>{const b=LN&&e.target.closest&&e.target.closest('[data-lbox]');if(!b)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(id)sortTo(id,b.dataset.lbox)});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='flip'&&(e.key==='Enter')&&T&&!T.revealed){e.preventDefault()}},true);

/* ---------- boot ---------- */
render();renderStore();lsSave();
initSheet();
setInterval(()=>{if(!T&&!sheetOpen&&view==='today'&&document.visibilityState==='visible')renderNav()},60000);
})();
</script>
